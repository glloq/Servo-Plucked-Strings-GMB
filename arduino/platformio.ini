; PlatformIO — version Arduino de Servo-Plucked-String
;
;   Compiler :  pio run                 (tous les environnements)
;               pio run -e leonardo     (une seule carte)
;   Téléverser: pio run -e leonardo -t upload
;
; Le sketch suit la disposition compatible IDE Arduino :
;   Servo-Plucked-String/Servo-Plucked-String.ino  +  Servo-Plucked-String/src/**
;
; IMPORTANT — Compatibilité MIDI :
;   Le code utilise la bibliothèque *MIDIUSB* (MidiUSB.read(), midiEventPacket_t),
;   qui vise les cartes à USB natif ATmega32u4 / SAMD / SAM :
;   Leonardo, Micro, (Pro)Micro, Zero, MKR, Due.
;   Le Teensy utilise une autre API (usbMIDI) : il faut adapter
;   src/midi/MIDIHandler.* pour cette cible (voir docs/LIMITES.md §4.1).

[platformio]
src_dir = Servo-Plucked-String

[env]
framework = arduino
build_flags = -Wall
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0
    arduino-libraries/MIDIUSB@^1.0.5

; ---- Arduino Leonardo / Micro (ATmega32u4, USB natif) ----
; Cible peu coûteuse et répandue. Attention à la SRAM (2,5 Ko) :
; garder de petites configurations, voir docs/LIMITES.md §1.
[env:leonardo]
platform = atmelavr
board = leonardo

[env:micro]
platform = atmelavr
board = micro

; ---- Arduino Zero / MKR (SAMD21, USB natif, 32 Ko SRAM) ----
; Plus de RAM que le 32u4 : meilleur choix pour de grosses configurations.
[env:zero]
platform = atmelsam
board = zero

; ---- Arduino Due (SAM3X, USB natif) ----
[env:due]
platform = atmelsam
board = due

; ---- Teensy 4.x : NON prêt à l'emploi ----
; Le Teensy n'utilise pas la bibliothèque MIDIUSB mais son API usbMIDI.
; Décommenter puis adapter src/midi/MIDIHandler.* (usbMIDI.read(), etc.).
; [env:teensy40]
; platform = teensy
; board = teensy40
