; PlatformIO — version Arduino de Servo-Plucked-String
;
;   Compiler :  pio run                 (environnement par défaut : leonardo)
;   Téléverser: pio run -t upload
;
; Le sketch suit la disposition compatible IDE Arduino :
;   Servo-Plucked-String/Servo-Plucked-String.ino  +  Servo-Plucked-String/src/**
;
; CIBLE DU PROJET : Arduino Leonardo (ATmega32u4, USB natif).
; Le code utilise la bibliothèque *MIDIUSB* (MidiUSB.read(), midiEventPacket_t).
; ⚠️ SRAM limitée (2,5 Ko) : garder des configurations raisonnables et laisser
;    DEBUG utilisable grâce au macro F() (littéraux gardés en flash).
;    Voir docs/LIMITES.md.

[platformio]
src_dir = Servo-Plucked-String
default_envs = leonardo

[env]
framework = arduino
build_flags = -Wall
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0
    arduino-libraries/MIDIUSB@^1.0.5

; ===== CIBLE : Arduino Leonardo =====
[env:leonardo]
platform = atmelavr
board = leonardo

; Micro : même puce (ATmega32u4) que le Leonardo — interchangeable.
[env:micro]
platform = atmelavr
board = micro

; ----- Autres cartes à USB natif compatibles MIDIUSB (NON ciblées, non testées) -----
; Fournies par commodité pour un éventuel portage. Le Teensy n'est PAS compatible
; (API usbMIDI ≠ MIDIUSB) : il faudrait adapter src/midi/MIDIHandler.*.
; [env:zero]
; platform = atmelsam
; board = zero
;
; [env:due]
; platform = atmelsam
; board = due
